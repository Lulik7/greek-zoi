<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4A148C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Nunito — округлый «мультяшный» шрифт для заголовков и текста -->
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400..1000;1,400..900&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Слушаю греческий — говорю по-гречески. Онлайн-школа греческого языка Зои Павловской: песни и диалоги с текстами по уровням A1–B2."
    />
    <title>Слушаю греческий — говорю по-гречески</title>
    <!--
      Карточка ссылки в мессенджерах и соцсетях. Их сборщики не выполняют
      скрипты и видят только эти теги, поэтому здесь общее описание сайта;
      заголовок конкретной страницы для поисковиков проставляет src/lib/pageMeta.ts.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Слушаю греческий — говорю по-гречески" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Слушаю греческий — говорю по-гречески" />
    <meta
      property="og:description"
      content="Онлайн-школа греческого языка Зои Павловской: песни и диалоги с текстами и переводом по уровням A1–B2."
    />
    <meta property="og:url" content="https://greek-zoi.com/" />
    <!--
      Картинка карточки. Адрес обязательно полный: сборщики читают тег
      в отрыве от страницы и относительный путь им не с чем сложить.
      Размеры указаны рядом — с ними мессенджер рисует карточку сразу,
      не дожидаясь загрузки самого файла.
    -->
    <meta property="og:image" content="https://greek-zoi.com/og-image.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta
      property="og:image:alt"
      content="Девушка поёт под гитару, вокруг летают греческие буквы"
    />
    <!-- широкая карточка вместо маленького значка сбоку -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
