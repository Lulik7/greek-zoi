# Описание сервиса для Render (Blueprint).
# Можно не использовать и завести Web Service руками — значения те же.
services:
  - type: web
    name: greek-zoi
    runtime: node
    # Тариф с постоянным диском: на free диск не подключить, и база
    # вместе со всеми материалами стиралась бы при каждом перезапуске.
    plan: starter
    # npm ci ставит ровно то, что в package-lock.json
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/bootstrap
    # Постоянный диск: здесь живут база school.db и загруженные аудиофайлы.
    # Переживает перезапуски и повторные выкладки.
    disk:
      name: greek-zoi-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      # Render сгенерирует случайный ключ сам — руками вводить ничего не нужно.
      - key: JWT_SECRET
        generateValue: true
      # Папка на подключённом диске: туда лягут data/ и uploads/
      - key: STORAGE_DIR
        value: /var/data
      # Адрес сайта: заполняется вручную после того, как Render выдаст домен.
      - key: PUBLIC_URL
        sync: false
      # Почта администратора — под ней вход в админку
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # --- Почта: значения вводятся в панели Render, в файл не попадают ---
      # Render закрывает исходящие SMTP-порты, поэтому письма уходят через
      # почтовый сервис обычным веб-запросом. Заполняется один ключ из двух.
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      # SMTP остаётся на случай переезда на свой сервер, где порты открыты
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # 1 — требовать подтверждение почты перед оплатой. Включать после того,
      # как письма реально начнут уходить.
      - key: REQUIRE_VERIFIED_EMAIL
        value: "0"

      # --- Оплата: значения вводятся в панели Render ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: eur
